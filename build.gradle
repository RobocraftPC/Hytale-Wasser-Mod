plugins {
    id 'java'
}

group = 'de.tmjh'
version = '0.1.0'

repositories {
    mavenCentral()
    // HytaleServer.jar liegt hier, siehe libraries/README.md
    flatDir {
        dirs 'libraries'
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Die Stroemungslogik unter de.tmjh.stroemwerk.flow und .platform kommt ohne
// Server aus. Nur das Paket .hytale braucht die Server-Jar, damit die Tests
// auch ohne installiertes Hytale laufen.
def hytaleSources = 'de/tmjh/stroemwerk/hytale/**'
def serverJar = file('libraries/HytaleServer.jar')

sourceSets {
    main {
        java {
            if (!serverJar.exists()) {
                exclude hytaleSources
            }
        }
    }
}

dependencies {
    if (serverJar.exists()) {
        compileOnly name: 'HytaleServer'
    }
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'

    testImplementation platform('org.junit:junit-bom:5.11.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('compileJava') {
    doFirst {
        if (!serverJar.exists()) {
            logger.warn('libraries/HytaleServer.jar fehlt - das Paket .hytale wird uebersprungen. ' +
                    'Siehe libraries/README.md.')
        }
    }
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'failed', 'skipped'
    }
}

tasks.named('jar') {
    archiveBaseName = 'Stroemwerk'
    doLast {
        if (!serverJar.exists()) {
            logger.warn('Diese Jar enthaelt kein Plugin-Einstiegspunkt, weil HytaleServer.jar fehlte.')
        }
    }
}

// Legt jede gebaute Jar durchnummeriert in out/ ab, damit sich zwei Staende
// im Spiel vergleichen lassen. Der Zaehler liegt in out/build-number.txt und
// ist nicht eingecheckt - die Nummern gelten also nur auf diesem Rechner.
def outDir = layout.projectDirectory.dir('out').asFile
def builtJar = tasks.named('jar', Jar).flatMap { it.archiveFile }
def projectVersion = version.toString()

tasks.register('archiveJar') {
    group = 'build'
    description = 'Kopiert die gebaute Jar mit fortlaufender Build-Nummer nach out/.'

    // Haengt an test, damit aus einem roten Build keine Jar in out/ landet.
    dependsOn tasks.named('jar'), tasks.named('test')

    // Jeder Build soll seine eigene Nummer bekommen, nie uebersprungen werden.
    outputs.upToDateWhen { false }

    doLast {
        outDir.mkdirs()
        def counter = new File(outDir, 'build-number.txt')
        def number = (counter.exists() ? counter.text.trim() as int : 0) + 1
        counter.text = "$number\n"

        def target = new File(outDir, "Stroemwerk-${projectVersion}-b${number}.jar")
        target.bytes = builtJar.get().asFile.bytes
        logger.lifecycle("-> out/${target.name}")
    }
}

tasks.named('build') {
    finalizedBy 'archiveJar'
}

// Baut die Bloecke als reines Asset-Pack, also ohne Java-Anteil. Damit lassen
// sich Texturen und Item-Definitionen im Spiel ansehen, bevor das Plugin
// vollstaendig angebunden ist. Ergebnis nach UserData/Packs/ kopieren.
tasks.register('assetPack', Copy) {
    group = 'stroemwerk'
    description = 'Legt das Asset-Pack unter build/pack/Stroemwerk ab'

    from('src/main/resources') {
        include 'Common/**'
        include 'Server/**'
    }
    into layout.buildDirectory.dir('pack/Stroemwerk')

    doLast {
        // Ein Pack laedt ohne Plugin, darf also nicht auf eine Hauptklasse zeigen.
        def full = new groovy.json.JsonSlurper().parse(file('src/main/resources/manifest.json'))
        full.remove('Main')
        full.remove('IncludesAssetPack')
        def target = layout.buildDirectory.file('pack/Stroemwerk/manifest.json').get().asFile
        target.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(full))

        logger.lifecycle("Asset-Pack fertig: ${target.parentFile}")
        logger.lifecycle('Diesen Ordner nach %appdata%/Hytale/UserData/Packs/ kopieren ' +
                'und in den Welteinstellungen aktivieren.')
    }
}
