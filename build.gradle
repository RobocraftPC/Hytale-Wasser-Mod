plugins {
    id 'java'
}

group = 'de.tmjh'
version = '0.1.0'

repositories {
    mavenCentral()
    // HytaleServer.jar liegt hier, siehe libraries/README.md
    flatDir {
        dirs 'libraries'
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Die Stroemungslogik unter de.tmjh.stroemwerk.flow und .platform kommt ohne
// Server aus. Nur das Paket .hytale braucht die Server-Jar, damit die Tests
// auch ohne installiertes Hytale laufen.
def hytaleSources = 'de/tmjh/stroemwerk/hytale/**'
def serverJar = file('libraries/HytaleServer.jar')

sourceSets {
    main {
        java {
            if (!serverJar.exists()) {
                exclude hytaleSources
            }
        }
    }
}

dependencies {
    if (serverJar.exists()) {
        compileOnly name: 'HytaleServer'
    }
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'

    testImplementation platform('org.junit:junit-bom:5.11.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('compileJava') {
    doFirst {
        if (!serverJar.exists()) {
            logger.warn('libraries/HytaleServer.jar fehlt - das Paket .hytale wird uebersprungen. ' +
                    'Siehe libraries/README.md.')
        }
    }
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'failed', 'skipped'
    }
}

tasks.named('jar') {
    archiveBaseName = 'Stroemwerk'
    doLast {
        if (!serverJar.exists()) {
            logger.warn('Diese Jar enthaelt kein Plugin-Einstiegspunkt, weil HytaleServer.jar fehlte.')
        }
    }
}

// Legt jede gebaute Jar durchnummeriert in out/ ab, damit sich zwei Staende
// im Spiel vergleichen lassen. Der Zaehler liegt in out/build-number.txt und
// ist nicht eingecheckt - die Nummern gelten also nur auf diesem Rechner.
def outDir = layout.projectDirectory.dir('out').asFile
def builtJar = tasks.named('jar', Jar).flatMap { it.archiveFile }
def projectVersion = version.toString()

tasks.register('archiveJar') {
    group = 'build'
    description = 'Kopiert die gebaute Jar mit fortlaufender Build-Nummer nach out/.'

    // Haengt an test, damit aus einem roten Build keine Jar in out/ landet.
    dependsOn tasks.named('jar'), tasks.named('test')

    // Jeder Build soll seine eigene Nummer bekommen, nie uebersprungen werden.
    outputs.upToDateWhen { false }

    doLast {
        outDir.mkdirs()
        def counter = new File(outDir, 'build-number.txt')
        def number = (counter.exists() ? counter.text.trim() as int : 0) + 1
        counter.text = "$number\n"

        def target = new File(outDir, "Stroemwerk-${projectVersion}-b${number}.jar")
        target.bytes = builtJar.get().asFile.bytes
        logger.lifecycle("-> out/${target.name}")
    }
}

tasks.named('build') {
    finalizedBy 'archiveJar', 'deployMod'
}

// Kopiert die gebaute Jar direkt in den Mods-Ordner des Servers, damit nach
// dem Bauen nur noch der Server neu gestartet werden muss.
//
// Der Zielpfad steht in .env (nicht eingecheckt, siehe .env.example):
//
//     HYTALE_MODS_DIR=C:\Users\<Name>\AppData\Roaming\Hytale\UserData\Mods
//
// Ohne .env passiert nichts - der Task meldet das und ist fertig. So stoert
// er auf Rechnern nicht, die den Mod nur bauen wollen.
def modsDirKey = 'HYTALE_MODS_DIR'
def envFile = layout.projectDirectory.file('.env').asFile
def jarPrefix = 'Stroemwerk-'

// Liest einen Schluessel aus einer .env-Datei. Kommentarzeilen und
// Anfuehrungszeichen um den Wert werden dabei entfernt.
def readEnvValue = { File file, String key ->
    if (!file.isFile()) {
        return null
    }
    String found = null
    file.eachLine('UTF-8') { String line ->
        String trimmed = line.trim()
        if (trimmed.isEmpty() || trimmed.startsWith('#')) {
            return
        }
        int separator = trimmed.indexOf('=')
        if (separator <= 0 || trimmed.substring(0, separator).trim() != key) {
            return
        }
        String value = trimmed.substring(separator + 1).trim()
        if (value.length() >= 2
                && ((value.startsWith('"') && value.endsWith('"'))
                || (value.startsWith("'") && value.endsWith("'")))) {
            value = value.substring(1, value.length() - 1)
        }
        found = value
    }
    return found
}

tasks.register('deployMod') {
    group = 'stroemwerk'
    description = "Kopiert die Jar in den Mods-Ordner aus .env ($modsDirKey)."

    // Wie archiveJar an test gehaengt: aus einem roten Build soll nichts
    // im Spiel landen.
    dependsOn tasks.named('jar'), tasks.named('test')
    outputs.upToDateWhen { false }

    doLast {
        String configured = readEnvValue(envFile, modsDirKey) ?: System.getenv(modsDirKey)
        if (configured == null || configured.trim().isEmpty()) {
            logger.lifecycle("deployMod: kein $modsDirKey gesetzt - uebersprungen. " +
                    'Siehe .env.example.')
            return
        }

        File modsDir = new File(configured.trim())
        if (!modsDir.isDirectory()) {
            // Ein gesetzter, aber falscher Pfad ist fast immer ein Tippfehler.
            // Den still zu schlucken oder den Ordner anzulegen wuerde ihn nur
            // verstecken.
            throw new GradleException("$modsDirKey zeigt auf keinen Ordner: $modsDir")
        }

        // Nur die eigenen Jars aufraeumen. Ein pauschales *.jar wuerde hier
        // fremde Mods mitloeschen - der Ordner gehoert nicht uns allein.
        int removed = 0
        modsDir.listFiles()?.each { File candidate ->
            if (candidate.isFile()
                    && candidate.name.startsWith(jarPrefix)
                    && candidate.name.endsWith('.jar')) {
                if (candidate.delete()) {
                    removed++
                    logger.lifecycle("deployMod: entfernt ${candidate.name}")
                } else {
                    throw new GradleException("Konnte ${candidate.name} nicht loeschen - " +
                            'laeuft der Server noch?')
                }
            }
        }

        File source = builtJar.get().asFile
        File target = new File(modsDir, source.name)
        target.bytes = source.bytes

        logger.lifecycle("deployMod: ${target.name} nach $modsDir " +
                "(${removed} alte Datei${removed == 1 ? '' : 'en'} ersetzt)")
    }
}

// Baut die Bloecke als reines Asset-Pack, also ohne Java-Anteil. Damit lassen
// sich Texturen und Item-Definitionen im Spiel ansehen, bevor das Plugin
// vollstaendig angebunden ist. Ergebnis nach UserData/Packs/ kopieren.
tasks.register('assetPack', Copy) {
    group = 'stroemwerk'
    description = 'Legt das Asset-Pack unter build/pack/Stroemwerk ab'

    from('src/main/resources') {
        include 'Common/**'
        include 'Server/**'
    }
    into layout.buildDirectory.dir('pack/Stroemwerk')

    doLast {
        // Ein Pack laedt ohne Plugin, darf also nicht auf eine Hauptklasse zeigen.
        def full = new groovy.json.JsonSlurper().parse(file('src/main/resources/manifest.json'))
        full.remove('Main')
        full.remove('IncludesAssetPack')
        def target = layout.buildDirectory.file('pack/Stroemwerk/manifest.json').get().asFile
        target.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(full))

        logger.lifecycle("Asset-Pack fertig: ${target.parentFile}")
        logger.lifecycle('Diesen Ordner nach %appdata%/Hytale/UserData/Packs/ kopieren ' +
                'und in den Welteinstellungen aktivieren.')
    }
}
